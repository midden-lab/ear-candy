services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Container hardening — mirrors the deploy job's `run_app` flags in
    # ci-cd.yml (security audit M6). The app runs as uid 1000, binds an
    # unprivileged port and needs no Linux capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Loopback-only — mirrors the deploy job's binding in ci-cd.yml
    # (issue #81). A reverse proxy on the same host reaches this via
    # localhost; publishing to all interfaces bypassed TLS termination
    # entirely for anyone hitting :3000 directly.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - SERVE_CLIENT=true
      - PORT=3000
      - COOKIE_SECRET=${COOKIE_SECRET:?COOKIE_SECRET must be set}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set}
      # Optional — analytics work fully without it, the country breakdown
      # just stays empty until a database file actually exists at this
      # path. Defaults to the conventional location under the bind-mounted
      # data dir; override via your own .env if you want it elsewhere. See
      # scripts/fetch-geoip-db.sh and the README's Analytics section.
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/data/geoip/dbip-country-lite.mmdb}
      # Optional and OFF by default: empty/unset means no analytics events
      # are ever deleted. A whole number >= 30 keeps that many days and
      # permanently deletes older events (see README).
      - EVENTS_RETENTION_DAYS=${EVENTS_RETENTION_DAYS:-}
      # Optional. Pins the origin used in Open Graph tags instead of trusting
      # the request's Host header; empty/unset falls back to the Host header.
      # scheme://host[:port], no trailing slash or path (see README).
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

name: CI/CD

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least-privilege default for every job's GITHUB_TOKEN — only `build` needs
# more (packages: write, to push to GHCR) and already declares its own
# job-level permissions block, which overrides this default for that job.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Lint server
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Lint client
        working-directory: ./client
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Typecheck client
        working-directory: ./client
        run: |
          npm ci
          npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.export_sha.outputs.sha_tag }}
      image_digest: ${{ steps.resolve_digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export SHA tag
        id: export_sha
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: echo "sha_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # docker/build-push-action's own `digest` output has documented
      # reliability issues in some configs (upstream issues #461, #579,
      # #770 — it can report the local image ID rather than the actual
      # pushed manifest digest). Read the digest back from the registry
      # itself instead of trusting the action's output, so deploy can pull
      # by digest with a real cryptographic guarantee rather than a value
      # that might not match what's actually stored (issue #33).
      - name: Resolve authoritative image digest
        id: resolve_digest
        env:
          IMAGE_TAG: ${{ steps.export_sha.outputs.sha_tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "Failed to resolve image digest from registry" >&2
            exit 1
          fi
          echo "Resolved digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Needs packages:read (beyond the contents:read default) to pull the
    # image build just pushed to GHCR via GITHUB_TOKEN — without this, the
    # pull is denied even though the image itself is right there (a real
    # regression hit when the top-level permissions default was added).
    permissions:
      contents: read
      packages: read
    # Healthy runs (image pull, container start, browser install, 44 tests)
    # take ~4-6 minutes. This caps a genuine hang (browser/network stall,
    # not a slow/flaky test — those still fail via Playwright's own
    # per-test timeout) well short of GitHub's 6-hour default, so it fails
    # fast and stops burning CI minutes silently.
    timeout-minutes: 15
    # Full e2e (with a real Docker image + Playwright) is reserved for the
    # main branch and PRs targeting it — the dev branch's safety net is
    # lint/test/build only, kept fast since it runs on every push there.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker tag "$IMAGE" ear-candy:test

      # The test admin password is generated fresh per run, same as
      # COOKIE_SECRET — no fallback to a hardcoded value baked into the
      # workflow. The ear-candy-test container is ephemeral and only
      # reachable from this runner, but there's no reason for its admin
      # credential to be predictable across every CI run either (issue #45).
      - name: Generate CI-only credentials
        id: creds
        run: |
          COOKIE_SECRET=$(openssl rand -hex 32)
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          HASH=$(docker run --rm \
            -w /tmp \
            -e PW="$ADMIN_PASSWORD" \
            node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 \
            sh -c 'npm install --no-save --quiet bcryptjs >/dev/null 2>&1 && node -e "const b=require(\"bcryptjs\"); process.stdout.write(b.hashSync(process.env.PW, 10))"')
          echo "::add-mask::$COOKIE_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$HASH"
          echo "cookie_secret=$COOKIE_SECRET" >> "$GITHUB_OUTPUT"
          echo "admin_password=$ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "admin_password_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Start test container
        env:
          COOKIE_SECRET: ${{ steps.creds.outputs.cookie_secret }}
          ADMIN_PASSWORD_HASH: ${{ steps.creds.outputs.admin_password_hash }}
        run: |
          docker run -d \
            --name ear-candy-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SERVE_CLIENT=true \
            -e PORT=3000 \
            -e COOKIE_SECRET="$COOKIE_SECRET" \
            -e ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            ear-candy:test

      - name: Wait for test app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/settings > /dev/null; then
              echo "Test app is ready"
              exit 0
            fi
            echo "Waiting for test app... ($i/30)"
            sleep 2
          done
          echo "Test app not ready"
          docker logs ear-candy-test
          exit 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        working-directory: ./e2e
        run: npx playwright install-deps chromium

      # Invoked directly (not via `npm test`) so log output streams in real
      # time — the npm wrapper was found to buffer all output until the
      # child process exits normally, which hid a real ~20-minute cascading
      # failure behind what looked like a silent hang.
      - name: Run E2E tests
        working-directory: ./e2e
        run: npx playwright test
        env:
          TEST_ADMIN_PASSWORD: ${{ steps.creds.outputs.admin_password }}
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Stop test container
        if: always()
        run: docker stop ear-candy-test && docker rm ear-candy-test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          DEPLOY_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          DEPLOY_ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Values are passed via the `env:` block above and forwarded into
          # the remote script's shell environment by name here, then
          # referenced as "$VAR" below — never spliced directly into the
          # script text via ${{ }}. Splicing would make any value containing
          # shell metacharacters execute as literal script on a job that
          # holds root SSH access to production (issue #31).
          envs: DEPLOY_REGISTRY,DEPLOY_IMAGE_NAME,DEPLOY_IMAGE_DIGEST,DEPLOY_GHCR_PAT,DEPLOY_GHCR_ACTOR,DEPLOY_COOKIE_SECRET,DEPLOY_ADMIN_PASSWORD_HASH
          script: |
            set -e
            if [ -z "$DEPLOY_IMAGE_DIGEST" ]; then
              echo "No image digest from the build job — refusing to deploy" >&2
              exit 1
            fi

            # Preflight, before touching the running container: the app now
            # refuses to boot with a COOKIE_SECRET under 32 characters
            # (issue #40). Checking here means a too-short secret fails the
            # deploy cleanly with the OLD container still up and serving
            # traffic, instead of stopping/removing it and only then
            # discovering the new one won't start — see docs/runbooks/
            # rotate-secrets.md if this fires.
            if [ "${#DEPLOY_COOKIE_SECRET}" -lt 32 ]; then
              echo "COOKIE_SECRET is under 32 characters — refusing to deploy (see docs/runbooks/rotate-secrets.md)" >&2
              exit 1
            fi

            # Pulling by digest (not tag) IS the integrity check — Docker
            # verifies the content hash as part of the pull itself, so a
            # tampered/wrong image simply fails to pull rather than needing
            # a separate, easily-faked "verification" step after the fact
            # (the old `docker inspect ... > /dev/null` here asserted
            # nothing — see issue #33).
            IMAGE="$DEPLOY_REGISTRY/$DEPLOY_IMAGE_NAME@$DEPLOY_IMAGE_DIGEST"
            echo "Pulling image by digest: $IMAGE"

            echo "$DEPLOY_GHCR_PAT" | docker login "$DEPLOY_REGISTRY" -u "$DEPLOY_GHCR_ACTOR" --password-stdin

            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker stop ear-candy || true
            docker rm ear-candy || true

            # The container now runs as the image's built-in non-root `node`
            # user (uid/gid 1000), not root (issue #36) — the bind-mounted
            # host directory must be owned by that same uid or the app can't
            # write its DB/uploads. Safe to run on every deploy (a no-op
            # once already correct); done after stopping the old (root)
            # container and before starting the new one, so there's no
            # window where a running container's own writes could race
            # against the ownership change.
            echo "Ensuring data directory ownership matches the container's non-root user..."
            chown -R 1000:1000 /opt/ear-candy/data

            echo "Starting new container..."
            # TRUSTED_PROXY_IPS: 172.17.0.1 is this Droplet's default Docker
            # bridge gateway — Caddy runs on the host and reverse-proxies to
            # this container's published port, and that host-to-container
            # hop gets NATed through the bridge, so from inside the
            # container Caddy's connection appears to originate from the
            # gateway address, not loopback (confirmed via `docker network
            # inspect bridge` and live request logs — issue #33). This is a
            # property of this specific deployment's Docker networking, so
            # it's declared here next to the rest of the deploy config it
            # depends on, not hardcoded into application source.
            #
            # GEOIP_DB_PATH is always set to this same path, unconditionally
            # — the app degrades gracefully (country breakdown just stays
            # empty) if no file exists there yet, so there's no need to
            # branch on whether it's actually present. The file itself
            # lives under the bind-mounted /opt/ear-candy/data (persists
            # across deploys/container recreation) and is NOT something
            # this workflow downloads — run scripts/fetch-geoip-db.sh
            # against the Droplet to populate/refresh it (see README).
            # A real deploy once ran with this env var missing entirely —
            # the file existed on disk but the running container was never
            # told where to look, so country tracking silently stayed off
            # until this was added (issue #106).
            # Loopback-only publish: Caddy runs on this host (not
            # containerized) and reverse-proxies via `reverse_proxy
            # localhost:3000` in its Caddyfile — that's loopback traffic,
            # unaffected by this. Publishing to 0.0.0.0 (the old behavior)
            # made the app directly reachable over plain HTTP on a
            # non-standard port from anywhere on the internet, completely
            # bypassing Caddy's TLS termination (confirmed live: a plain
            # `curl http://<droplet-ip>:3000/api/health` returned 200).
            # Fixes issue #81.
            docker run -d \
              --name ear-candy \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -p 127.0.0.1:3000:3000 \
              -v /opt/ear-candy/data:/app/data \
              -e NODE_ENV=production \
              -e SERVE_CLIENT=true \
              -e PORT=3000 \
              -e COOKIE_SECRET="$DEPLOY_COOKIE_SECRET" \
              -e ADMIN_PASSWORD_HASH="$DEPLOY_ADMIN_PASSWORD_HASH" \
              -e TRUSTED_PROXY_IPS="127.0.0.1,::1,172.17.0.1" \
              -e GEOIP_DB_PATH="/app/data/geoip/dbip-country-lite.mmdb" \
              "$IMAGE"

            echo "Pruning dangling images..."
            docker image prune -f || true

            echo "Waiting for health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "App is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            exit 1

  # A separate job (not just deploy's own internal health-check loop above)
  # so "the app is verified healthy" is its own distinct, independently
  # visible CI result — catches the case where deploy's internal check
  # itself gets accidentally broken or removed in some future edit (#16).
  verify-production:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify /api/health on the production Droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            RESPONSE=$(curl -sf http://localhost:3000/api/health)
            echo "Response: $RESPONSE"
            echo "$RESPONSE" | grep -q '"ok":true'

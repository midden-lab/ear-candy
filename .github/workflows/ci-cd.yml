name: CI/CD

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Lint server
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Lint client
        working-directory: ./client
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Typecheck client
        working-directory: ./client
        run: |
          npm ci
          npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.export_sha.outputs.sha_tag }}
      image_digest: ${{ steps.resolve_digest.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export SHA tag
        id: export_sha
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: echo "sha_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # docker/build-push-action's own `digest` output has documented
      # reliability issues in some configs (upstream issues #461, #579,
      # #770 — it can report the local image ID rather than the actual
      # pushed manifest digest). Read the digest back from the registry
      # itself instead of trusting the action's output, so deploy can pull
      # by digest with a real cryptographic guarantee rather than a value
      # that might not match what's actually stored (issue #33).
      - name: Resolve authoritative image digest
        id: resolve_digest
        env:
          IMAGE_TAG: ${{ steps.export_sha.outputs.sha_tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "Failed to resolve image digest from registry" >&2
            exit 1
          fi
          echo "Resolved digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Healthy runs (image pull, container start, browser install, 44 tests)
    # take ~4-6 minutes. This caps a genuine hang (browser/network stall,
    # not a slow/flaky test — those still fail via Playwright's own
    # per-test timeout) well short of GitHub's 6-hour default, so it fails
    # fast and stops burning CI minutes silently.
    timeout-minutes: 15
    # Full e2e (with a real Docker image + Playwright) is reserved for the
    # main branch and PRs targeting it — the dev branch's safety net is
    # lint/test/build only, kept fast since it runs on every push there.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker tag "$IMAGE" ear-candy:test

      - name: Generate CI-only credentials
        id: creds
        run: |
          COOKIE_SECRET=$(openssl rand -hex 32)
          HASH=$(docker run --rm \
            -w /tmp \
            -e PW="$PASSWORD" \
            node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 \
            sh -c 'npm install --no-save --quiet bcryptjs >/dev/null 2>&1 && node -e "const b=require(\"bcryptjs\"); process.stdout.write(b.hashSync(process.env.PW, 10))"')
          echo "::add-mask::$COOKIE_SECRET"
          echo "::add-mask::$HASH"
          echo "cookie_secret=$COOKIE_SECRET" >> "$GITHUB_OUTPUT"
          echo "admin_password_hash=$HASH" >> "$GITHUB_OUTPUT"
        env:
          PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'changeme' }}

      - name: Start test container
        env:
          COOKIE_SECRET: ${{ steps.creds.outputs.cookie_secret }}
          ADMIN_PASSWORD_HASH: ${{ steps.creds.outputs.admin_password_hash }}
        run: |
          docker run -d \
            --name ear-candy-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SERVE_CLIENT=true \
            -e PORT=3000 \
            -e COOKIE_SECRET="$COOKIE_SECRET" \
            -e ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            ear-candy:test

      - name: Wait for test app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/settings > /dev/null; then
              echo "Test app is ready"
              exit 0
            fi
            echo "Waiting for test app... ($i/30)"
            sleep 2
          done
          echo "Test app not ready"
          docker logs ear-candy-test
          exit 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        working-directory: ./e2e
        run: npx playwright install-deps chromium

      # Invoked directly (not via `npm test`) so log output streams in real
      # time — the npm wrapper was found to buffer all output until the
      # child process exits normally, which hid a real ~20-minute cascading
      # failure behind what looked like a silent hang.
      - name: Run E2E tests
        working-directory: ./e2e
        run: npx playwright test
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'changeme' }}
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Stop test container
        if: always()
        run: docker stop ear-candy-test && docker rm ear-candy-test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          DEPLOY_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          DEPLOY_ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Values are passed via the `env:` block above and forwarded into
          # the remote script's shell environment by name here, then
          # referenced as "$VAR" below — never spliced directly into the
          # script text via ${{ }}. Splicing would make any value containing
          # shell metacharacters execute as literal script on a job that
          # holds root SSH access to production (issue #31).
          envs: DEPLOY_REGISTRY,DEPLOY_IMAGE_NAME,DEPLOY_IMAGE_DIGEST,DEPLOY_GHCR_PAT,DEPLOY_GHCR_ACTOR,DEPLOY_COOKIE_SECRET,DEPLOY_ADMIN_PASSWORD_HASH
          script: |
            set -e
            if [ -z "$DEPLOY_IMAGE_DIGEST" ]; then
              echo "No image digest from the build job — refusing to deploy" >&2
              exit 1
            fi

            # Pulling by digest (not tag) IS the integrity check — Docker
            # verifies the content hash as part of the pull itself, so a
            # tampered/wrong image simply fails to pull rather than needing
            # a separate, easily-faked "verification" step after the fact
            # (the old `docker inspect ... > /dev/null` here asserted
            # nothing — see issue #33).
            IMAGE="$DEPLOY_REGISTRY/$DEPLOY_IMAGE_NAME@$DEPLOY_IMAGE_DIGEST"
            echo "Pulling image by digest: $IMAGE"

            echo "$DEPLOY_GHCR_PAT" | docker login "$DEPLOY_REGISTRY" -u "$DEPLOY_GHCR_ACTOR" --password-stdin

            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker stop ear-candy || true
            docker rm ear-candy || true

            echo "Starting new container..."
            docker run -d \
              --name ear-candy \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /opt/ear-candy/data:/app/data \
              -e NODE_ENV=production \
              -e SERVE_CLIENT=true \
              -e PORT=3000 \
              -e COOKIE_SECRET="$DEPLOY_COOKIE_SECRET" \
              -e ADMIN_PASSWORD_HASH="$DEPLOY_ADMIN_PASSWORD_HASH" \
              "$IMAGE"

            echo "Pruning dangling images..."
            docker image prune -f || true

            echo "Waiting for health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "App is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            exit 1

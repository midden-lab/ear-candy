name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint server
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Lint client
        working-directory: ./client
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck client
        working-directory: ./client
        run: |
          npm ci
          npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.export_sha.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export SHA tag
        id: export_sha
        run: echo "sha_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Healthy runs (image pull, container start, browser install, 44 tests)
    # take ~4-6 minutes. This caps a genuine hang (browser/network stall,
    # not a slow/flaky test — those still fail via Playwright's own
    # per-test timeout) well short of GitHub's 6-hour default, so it fails
    # fast and stops burning CI minutes silently.
    timeout-minutes: 25 # TEMP: widened while diagnosing a CI-only slowdown, restore to 15 after
    # Full e2e (with a real Docker image + Playwright) is reserved for the
    # main branch and PRs targeting it — the dev branch's safety net is
    # lint/test/build only, kept fast since it runs on every push there.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker tag "$IMAGE" ear-candy:test

      - name: Generate CI-only credentials
        id: creds
        run: |
          COOKIE_SECRET=$(openssl rand -hex 32)
          HASH=$(docker run --rm \
            -w /tmp \
            -e PW="$PASSWORD" \
            node:20-alpine \
            sh -c 'npm install --no-save --quiet bcryptjs >/dev/null 2>&1 && node -e "const b=require(\"bcryptjs\"); process.stdout.write(b.hashSync(process.env.PW, 10))"')
          echo "::add-mask::$COOKIE_SECRET"
          echo "::add-mask::$HASH"
          echo "cookie_secret=$COOKIE_SECRET" >> "$GITHUB_OUTPUT"
          echo "admin_password_hash=$HASH" >> "$GITHUB_OUTPUT"
        env:
          PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'changeme' }}

      - name: Start test container
        run: |
          docker run -d \
            --name ear-candy-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SERVE_CLIENT=true \
            -e PORT=3000 \
            -e COOKIE_SECRET='${{ steps.creds.outputs.cookie_secret }}' \
            -e ADMIN_PASSWORD_HASH='${{ steps.creds.outputs.admin_password_hash }}' \
            ear-candy:test

      - name: Wait for test app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/settings > /dev/null; then
              echo "Test app is ready"
              exit 0
            fi
            echo "Waiting for test app... ($i/30)"
            sleep 2
          done
          echo "Test app not ready"
          docker logs ear-candy-test
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        working-directory: ./e2e
        run: npx playwright install-deps chromium

      # TEMP: `npm test` (npm-wrapped) appears to buffer all output until the
      # child process exits normally — two prior runs showed zero log output
      # at all before hitting the timeout and being canceled, vs. a direct
      # `npx playwright test` invocation which streamed real-time progress.
      # Invoking Playwright directly here to see what's actually happening.
      # Revert to `npm test` once diagnosed.
      - name: Run E2E tests
        working-directory: ./e2e
        run: npx playwright test
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'changeme' }}
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Stop test container
        if: always()
        run: docker stop ear-candy-test && docker rm ear-candy-test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "Pulling image: $IMAGE"

            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            echo "Verifying image digest..."
            docker inspect "$IMAGE" --format='{{.RepoDigests}}' > /dev/null

            echo "Stopping old container..."
            docker stop ear-candy || true
            docker rm ear-candy || true

            echo "Starting new container..."
            docker run -d \
              --name ear-candy \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /opt/ear-candy/data:/app/data \
              -e NODE_ENV=production \
              -e SERVE_CLIENT=true \
              -e PORT=3000 \
              -e COOKIE_SECRET='${{ secrets.COOKIE_SECRET }}' \
              -e ADMIN_PASSWORD_HASH='${{ secrets.ADMIN_PASSWORD_HASH }}' \
              "$IMAGE"

            echo "Pruning dangling images..."
            docker image prune -f || true

            echo "Waiting for health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "App is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            exit 1

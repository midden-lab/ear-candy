name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint server
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Lint client
        working-directory: ./client
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck client
        working-directory: ./client
        run: |
          npm ci
          npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ear-candy:test
          cache-from: type=gha

      - name: Start test container
        run: |
          docker run -d \
            --name ear-candy-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SERVE_CLIENT=true \
            -e PORT=3000 \
            -e COOKIE_SECRET='test-cookie-secret-for-ci' \
            -e ADMIN_PASSWORD_HASH='$2b$10$aF4QagAZkZG4mQx8uQo.1..UFYDw3cY.jh4kUgXlVuL01F2jO.9Ei' \
            ear-candy:test

      - name: Wait for test app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/settings > /dev/null; then
              echo "Test app is ready"
              exit 0
            fi
            echo "Waiting for test app... ($i/30)"
            sleep 2
          done
          echo "Test app not ready"
          docker logs ear-candy-test
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Run E2E tests
        working-directory: ./e2e
        run: npm test
        env:
          TEST_ADMIN_PASSWORD: testpass
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Stop test container
        if: always()
        run: docker stop ear-candy-test && docker rm ear-candy-test

  e2e-ui:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ear-candy:test
          cache-from: type=gha

      - name: Start test container
        run: |
          docker run -d \
            --name ear-candy-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SERVE_CLIENT=true \
            -e PORT=3000 \
            -e COOKIE_SECRET='test-cookie-secret-for-ci' \
            -e ADMIN_PASSWORD_HASH='$2b$10$aF4QagAZkZG4mQx8uQo.1..UFYDw3cY.jh4kUgXlVuL01F2jO.9Ei' \
            ear-candy:test

      - name: Wait for test app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/settings > /dev/null; then
              echo "Test app is ready"
              exit 0
            fi
            echo "Waiting for test app... ($i/30)"
            sleep 2
          done
          echo "Test app not ready"
          docker logs ear-candy-test
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Run E2E UI tests
        working-directory: ./e2e
        run: xvfb-run -a npm run test:ui
        env:
          TEST_ADMIN_PASSWORD: testpass
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-ui
          path: e2e/screenshots/
          retention-days: 7

      - name: Stop test container
        if: always()
        run: docker stop ear-candy-test && docker rm ear-candy-test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e, e2e-ui]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "Pulling image: $IMAGE"

            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker pull $IMAGE

            echo "Stopping old container..."
            docker stop ear-candy || true
            docker rm ear-candy || true

            echo "Starting new container..."
            docker run -d \
              --name ear-candy \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /opt/ear-candy/data:/app/data \
              -e NODE_ENV=production \
              -e SERVE_CLIENT=true \
              -e PORT=3000 \
              -e COOKIE_SECRET='${{ secrets.COOKIE_SECRET }}' \
              -e ADMIN_PASSWORD_HASH='${{ secrets.ADMIN_PASSWORD_HASH }}' \
              $IMAGE

            echo "Pruning old images..."
            docker image prune -af --filter "until=168h" || true

            echo "Waiting for health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:3000 > /dev/null; then
                echo "App is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            exit 1
